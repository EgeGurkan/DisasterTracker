name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # FCM push bildirimleri için google-services.json gerekir.
      # Depo Settings → Secrets → Actions → GOOGLE_SERVICES_JSON (dosyanın tüm içeriği).
      # Secret yoksa APK yine üretilir ama FCM bildirimleri çalışmaz.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret yok; FCM devre dışı derleniyor."
            node -e "const f='app.json',j=require('./'+f);delete j.expo.android.googleServicesFile;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          fi

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle assembleRelease
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: afet-takip-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
